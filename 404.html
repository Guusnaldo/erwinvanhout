<!DOCTYPE html>

  <style>

      margin: 0;

    p { margin: 0 0 22px; color: #667077; font-size: 14.5px; line-height: 1.65; }
    a.knop {
      display: inline-block;
      background: #1259a6;
      color: #ffffff;
      border-radius: 999px;
      font-weight: 700;
      font-size: 15px;
      padding: 13px 36px;
      text-decoration: none;
    }
    a.knop:hover { background: #0d4278; }

<body>
  <div class="kaart">
    <div class="bord">P</div>
    <h1>Verkeerd gereden</h1>
